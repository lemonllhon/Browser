syntax = "proto3";

package trace.v1;

option go_package = "ant-chrome/proto/trace/v1;tracev1";

message AppConfigInfo {
  string name = 1;
  string version = 2;
  string project_github_url = 3;
}

message AppPathRequest {
  string path = 1;
}

message AppReleasePageRequest {
  string url = 1;
}

message AppDashboardStats {
  int32 total_instances = 1;
  int32 running_instances = 2;
  int32 proxy_count = 3;
  int32 core_count = 4;
  int32 mem_used_mb = 5;
  string app_version = 6;
}

message AppPerformanceSnapshot {
  int64 timestamp_ms = 1;
  string app_version = 2;
  string platform = 3;
  string arch = 4;
  int32 mem_alloc_mb = 5;
  int32 mem_sys_mb = 6;
  int32 mem_heap_inuse_mb = 7;
  int32 mem_num_gc = 8;
  int32 goroutines = 9;
  int32 total_instances = 10;
  int32 running_instances = 11;
  int32 browser_processes = 12;
  int32 proxy_bridge_refs = 13;
  int32 xray_bridge_refs = 14;
  int32 clash_bridge_refs = 15;
  int32 switch_bridge_refs = 16;
  int32 auth_proxy_bridge_refs = 17;
  bool window_sync_active = 18;
  int32 window_sync_windows = 19;
  int32 window_sync_controllable = 20;
  int64 window_sync_events_total = 21;
  int64 window_sync_dispatch_total = 22;
}

message AppDataVersions {
  int64 timestamp_ms = 1;
  int64 profiles_version = 2;
  int64 groups_version = 3;
  int64 proxies_version = 4;
  int64 cores_version = 5;
  int64 extensions_version = 6;
  int64 defaults_version = 7;
  int64 settings_version = 8;
  int64 cookies_version = 9;
  int64 snapshots_version = 10;
  int64 logs_version = 11;
}

message AppLicenseStatus {
  int32 max_limit = 1;
  int32 used_count = 2;
  repeated string used_keys = 3;
}

message AppCDKeyRedeemRequest {
  string cdkey = 1;
}

message AppCDKeysGenerateRequest {
  int32 count = 1;
}

message AppCDKeysGenerateResponse {
  repeated string keys = 1;
}

message AppRemoteAuthorProfileRequest {
  string url = 1;
  int32 timeout_ms = 2;
}

message AppRemoteAuthorProfileResponse {
  string json = 1;
}

message AppLogEntry {
  string time = 1;
  string level = 2;
  string component = 3;
  string message = 4;
  string fields_json = 5;
}

message AppLogListResponse {
  repeated AppLogEntry entries = 1;
}

message AppWindowStateSaveRequest {
  int32 width = 1;
  int32 height = 2;
}

message AppRuntimeEventPayload {
  string profile_id = 1;
  string profile_name = 2;
  string error = 3;
  string key = 4;
  string engine = 5;
  int32 debug_port = 6;
  int32 pid = 7;
  bool reused = 8;
  bool running = 9;
  bool debug_ready = 10;
  string runtime_warning = 11;
  string domain = 12;
  string reason = 13;
  int64 version = 14;
  int64 profiles_version = 15;
  int64 groups_version = 16;
  int64 proxies_version = 17;
  int64 cores_version = 18;
  int64 extensions_version = 19;
  int64 defaults_version = 20;
  int64 settings_version = 21;
  int64 cookies_version = 22;
  int64 snapshots_version = 23;
  repeated string changed_ids = 24;
  int64 logs_version = 25;
}

message AppWindowSize {
  int32 width = 1;
  int32 height = 2;
}

message AppWindowState {
  bool normal = 1;
  bool maximised = 2;
  bool minimised = 3;
}

message AppEnvironmentInfo {
  string build_type = 1;
  string platform = 2;
  string arch = 3;
}

message AppFileDropPayload {
  int32 x = 1;
  int32 y = 2;
  repeated string paths = 3;
}

message BackupImportRequest {
  bool reset_first = 1;
}

message BackupFailedComponent {
  string component_id = 1;
  string component_name = 2;
  string error = 3;
}

message BackupActionResult {
  bool cancelled = 1;
  string message = 2;
  string zip_path = 3;
  bool reset_first = 4;
  int32 imported = 5;
  int32 skipped = 6;
  int32 conflicts = 7;
  bool partial = 8;
  int32 component_total = 9;
  int32 component_success = 10;
  int32 component_failed = 11;
  repeated BackupFailedComponent failed_components = 12;
  int32 included_entries = 13;
  int32 skipped_entries = 14;
  int32 file_count = 15;
}

message BackupProgress {
  string phase = 1;
  int32 progress = 2;
  string message = 3;
  string component_id = 4;
  string component_name = 5;
  int32 entry_index = 6;
  int32 entry_total = 7;
  string timestamp = 8;
}
