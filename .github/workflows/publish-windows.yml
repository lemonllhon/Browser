name: Publish Windows Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version. Empty means read build/config.yml info.version."
        required: false
        default: ""
      release_tag:
        description: "Release tag to upload assets to, for example v1.1.0. Empty means v<version> for manual runs."
        required: false
        default: ""
      environment:
        description: "GitHub Environment for approvals and scoped PUBLIC_RELEASE_TOKEN/PUBLIC_RELEASE_REPOSITORY."
        required: true
        type: choice
        default: "staging"
        options:
          - staging
          - production
  push:
    tags:
      - "v*"
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure npm retry policy
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.96

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Resolve version
        id: version
        run: |
          $inputVersion = "${{ inputs.version }}".Trim()
          $inputReleaseTag = "${{ inputs.release_tag }}".Trim()
          $releaseEventTag = "${{ github.event.release.tag_name }}".Trim()
          $refType = "${{ github.ref_type }}".Trim()
          $refName = "${{ github.ref_name }}".Trim()

          $tag = ""
          if ($releaseEventTag) {
            $tag = $releaseEventTag
          } elseif ($refType -eq "tag") {
            $tag = $refName
          } elseif ($inputReleaseTag) {
            $tag = $inputReleaseTag
          }

          if ($inputVersion) {
            $version = $inputVersion
          } elseif ($tag) {
            $version = $tag -replace '^[vV][\.\-_]*', ''
          } else {
            $buildConfigText = Get-Content -LiteralPath "build/config.yml" -Raw
            $match = [regex]::Match($buildConfigText, '(?m)^\s{2}version:\s*["'']?([^"''\r\n]+)')
            if (-not $match.Success) {
              throw "Cannot resolve info.version from build/config.yml"
            }
            $version = [string]$match.Groups[1].Value
          }

          $version = $version.Trim()
          if ($version -match '^0\.0\.0\.(\d+)$') {
            $version = "0.0.$([int]$Matches[1])"
          } elseif ($version -match '^0\.(\d)(\d)$') {
            $version = "0.$($Matches[1]).$([int]$Matches[2])"
          } elseif ($version -match '^\d+\.\d+$') {
            $version = "$version.0"
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z\.-]+)?(?:\+[0-9A-Za-z\.-]+)?$') {
            throw "Invalid version: $version"
          }

          if (-not $tag) {
            $tag = "v$version"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version"
          Write-Host "Release tag: $tag"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          $maxAttempts = 3
          $exitCode = 1
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "npm ci attempt $attempt/$maxAttempts"
            npm ci --prefer-offline --no-audit --no-fund
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) {
              exit 0
            }
            Write-Warning "npm ci failed with exit code $exitCode"
            if ($attempt -lt $maxAttempts) {
              Start-Sleep -Seconds (15 * $attempt)
            }
          }
          exit $exitCode

      - name: Download Go modules
        run: go mod download

      - name: Sync Wails3 product version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $buildConfigPath = "build/config.yml"
          $buildConfigText = Get-Content -LiteralPath $buildConfigPath -Raw
          $pattern = '(?m)^(\s{2}version:\s*["'']?)([^"''\r\n]+)(["'']?)\s*$'
          $match = [regex]::Match($buildConfigText, $pattern)
          if (-not $match.Success) {
            throw "Cannot resolve info.version from build/config.yml"
          }
          $oldVersion = [string]$match.Groups[2].Value
          $updatedText = [regex]::Replace(
            $buildConfigText,
            $pattern,
            "`${1}$env:VERSION`${3}",
            1
          )
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Resolve-Path $buildConfigPath).Path, $updatedText, $utf8NoBom)
          Write-Host "build/config.yml info.version: $oldVersion -> $env:VERSION"

      - name: Build Windows app
        env:
          GOPROXY: https://proxy.golang.org,direct
          TRACE_BROWSER_VERSION: ${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          Push-Location frontend
          npm run build
          Pop-Location
          & ./scripts/build-wails3-windows.ps1 -Output build/bin/trace-browser.exe

      - name: Build installer cleanup helper
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          New-Item -ItemType Directory -Path "publish/output" -Force | Out-Null
          go build -trimpath -buildvcs=false -ldflags "-H windowsgui" -o "publish/output/trace-installer-cleanup.exe" ./tools/installer-cleanup
          if (-not (Test-Path -LiteralPath "publish/output/trace-installer-cleanup.exe" -PathType Leaf)) {
            throw "Installer cleanup helper was not created"
          }

      - name: Verify runtime binaries
        run: |
          $manifest = Get-Content -LiteralPath "publish/runtime-manifest.json" -Raw | ConvertFrom-Json
          $entries = @($manifest.files | Where-Object { $_.targets -contains "windows-amd64" })
          if ($entries.Count -eq 0) {
            throw "No windows-amd64 runtime entries found in publish/runtime-manifest.json"
          }

          foreach ($entry in $entries) {
            $path = [string]$entry.path
            $expected = ([string]$entry.sha256).ToLowerInvariant()
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing runtime file: $path"
            }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "Runtime hash mismatch: $path expected=$expected actual=$actual"
            }
          }

      - name: Create staging directory
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $staging = Join-Path $PWD "publish/staging"
          $output = Join-Path $PWD "publish/output"
          Remove-Item -LiteralPath $staging -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          New-Item -ItemType Directory -Path $output -Force | Out-Null

          $exe = "build/bin/trace-browser.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Missing built executable: $exe"
          }
          Copy-Item -LiteralPath $exe -Destination (Join-Path $staging "trace-browser.exe") -Force

          Copy-Item -LiteralPath "publish/config.init.yaml" -Destination (Join-Path $staging "config.yaml") -Force

          New-Item -ItemType Directory -Path (Join-Path $staging "bin") -Force | Out-Null
          $manifest = Get-Content -LiteralPath "publish/runtime-manifest.json" -Raw | ConvertFrom-Json
          $runtimeEntries = @($manifest.files | Where-Object { @($_.targets) -contains "windows-amd64" })
          if ($runtimeEntries.Count -eq 0) {
            throw "No windows-amd64 runtime entries found in publish/runtime-manifest.json"
          }
          foreach ($entry in $runtimeEntries) {
            $source = ([string]$entry.path).Replace("/", [string][System.IO.Path]::DirectorySeparatorChar)
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Missing runtime file: $source"
            }
            $dest = Join-Path $staging $source
            New-Item -ItemType Directory -Path (Split-Path $dest -Parent) -Force | Out-Null
            Copy-Item -LiteralPath $source -Destination $dest -Force
          }

          if (Test-Path -LiteralPath "chrome" -PathType Container) {
            New-Item -ItemType Directory -Path (Join-Path $staging "chrome") -Force | Out-Null
            Copy-Item -Path "chrome/*" -Destination (Join-Path $staging "chrome") -Recurse -Force -ErrorAction SilentlyContinue
          }

          New-Item -ItemType Directory -Path (Join-Path $staging "data") -Force | Out-Null
          Write-Host "Staging created: $staging"

      - name: Build portable package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $portable = "publish/output/TraceBrowser-Portable-$env:VERSION-win-x64.zip"
          Remove-Item -LiteralPath $portable -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "publish/staging/*" -DestinationPath $portable -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $portable -PathType Leaf)) {
            throw "Portable package was not created: $portable"
          }
          Write-Host "Portable package: $portable"

      - name: Build installer package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $makensis = (Get-Command makensis.exe).Source
          $staging = (Resolve-Path "publish/staging").Path
          $cleanupHelper = (Resolve-Path "publish/output/trace-installer-cleanup.exe").Path
          & $makensis /NOCONFIG "/DVERSION=$env:VERSION" "/DSTAGINGDIR=$staging" "/DCLEANUPHELPER=$cleanupHelper" "publish/installer.nsi"
          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE"
          }

          $installer = "publish/output/TraceBrowser-Setup-$env:VERSION.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Installer package was not created: $installer"
          }
          Write-Host "Installer package: $installer"

      - name: Generate Wails updater checksums
        run: |
          $assets = @()
          foreach ($pattern in @("TraceBrowser-Setup-*.exe", "TraceBrowser-Portable-*-win-x64.zip")) {
            $assets += @(Get-ChildItem -LiteralPath "publish/output" -Filter $pattern)
          }
          $setupAssets = @($assets | Where-Object { $_.Name -like "TraceBrowser-Setup-*.exe" })
          $portableAssets = @($assets | Where-Object { $_.Name -like "TraceBrowser-Portable-*-win-x64.zip" })
          if ($setupAssets.Count -eq 0) {
            throw "Missing installer package for SHA256SUMS"
          }
          if ($portableAssets.Count -eq 0) {
            throw "Missing portable package for SHA256SUMS"
          }
          $lines = @()
          foreach ($asset in ($assets | Sort-Object Name)) {
            $checksum = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset.FullName).Hash.ToLowerInvariant()
            $lines += "$checksum  $($asset.Name)"
          }
          $checksumPath = "publish/output/SHA256SUMS"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD.Path $checksumPath),
            ($lines -join "`n") + "`n",
            $utf8NoBom
          )
          Write-Host "Updater checksums: $checksumPath"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: trace-browser-windows-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            publish/output/TraceBrowser-Setup-*.exe
            publish/output/TraceBrowser-Portable-*-win-x64.zip
            publish/output/SHA256SUMS

      - name: Checkout public release repository
        if: ${{ vars.PUBLIC_RELEASE_REPOSITORY != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PUBLIC_RELEASE_REPOSITORY }}
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          path: public-release-repo

      - name: Resolve public release target
        id: public_release_target
        if: ${{ vars.PUBLIC_RELEASE_REPOSITORY != '' }}
        run: |
          $repo = Join-Path $env:GITHUB_WORKSPACE "public-release-repo"
          Set-Location -LiteralPath $repo

          $branch = git branch --show-current
          if (-not $branch) {
            $remoteHead = git symbolic-ref --short refs/remotes/origin/HEAD
            $branch = $remoteHead -replace '^origin/', ''
          }
          if (-not $branch) {
            throw "Cannot resolve default branch for public release repository"
          }

          $head = git rev-parse HEAD
          "target_commitish=$branch" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "target_sha=$head" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Public release target branch: $branch"
          Write-Host "Public release target sha: $head"

      - name: Upload packages to current repository release
        if: ${{ vars.PUBLIC_RELEASE_REPOSITORY == '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Trace Browser ${{ steps.version.outputs.version }}
          fail_on_unmatched_files: true
          files: |
            publish/output/TraceBrowser-Setup-*.exe
            publish/output/TraceBrowser-Portable-*-win-x64.zip
            publish/output/SHA256SUMS

      - name: Upload packages to public release repository
        if: ${{ vars.PUBLIC_RELEASE_REPOSITORY != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.PUBLIC_RELEASE_REPOSITORY }}
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.public_release_target.outputs.target_commitish }}
          name: Trace Browser ${{ steps.version.outputs.version }}
          fail_on_unmatched_files: true
          files: |
            publish/output/TraceBrowser-Setup-*.exe
            publish/output/TraceBrowser-Portable-*-win-x64.zip
            publish/output/SHA256SUMS
